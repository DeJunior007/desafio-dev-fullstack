services:
  # ---------------------------------------------------------------------------
  # Banco de Dados - MySQL 8
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: desafio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: desafiobd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psenha"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Backend - NestJS
  # ---------------------------------------------------------------------------
  backend:
    container_name: desafio-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: mysql://root:senha@mysql:3306/desafiobd
      PORT: 3333
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # Frontend - Next.js
  # ---------------------------------------------------------------------------
  frontend:
    container_name: desafio-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3333
    depends_on:
      - backend
    networks:
      - app-network

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mysql_data:

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge
